# Debezium Server 3.7.0.Final -> NATS JetStream (light stack). Mounted read-only at /debezium/config/application.properties.
# No secrets here: the database password comes from the environment (DEBEZIUM_SOURCE_DATABASE_PASSWORD, set by compose
# from CDC_PASSWORD; MicroProfile Config maps it onto debezium.source.database.password).
# Sink keys: https://debezium.io/documentation/reference/stable/operations/debezium-server.html  (section "NATS JetStream").

# ---- sink: NATS JetStream. The command service owns stream provisioning (stream CDC, subjects lakebase.>, file storage),
# so the sink must not create its own (its default is an in-memory stream). Change events land on lakebase.<schema>.<table>.
debezium.sink.type=nats-jetstream
debezium.sink.nats-jetstream.url=nats://nats:4222
debezium.sink.nats-jetstream.create-stream=false
debezium.sink.nats-jetstream.stream-name=CDC
debezium.sink.nats-jetstream.storage=file
debezium.sink.nats-jetstream.async.enabled=true
debezium.sink.nats-jetstream.async.timeout.ms=5000

# ---- format: plain JSON, no schema envelope (smaller messages; the query service reads before/after/op/source)
debezium.format.key=json
debezium.format.key.schemas.enable=false
debezium.format.value=json
debezium.format.value.schemas.enable=false

# ---- source: the same Postgres connector the heavy stack runs on Kafka Connect (cdc/debezium/postgres-connector.json)
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.offset.storage.file.filename=data/offsets.dat
debezium.source.offset.flush.interval.ms=1000
debezium.source.database.hostname=postgres-lakebase
debezium.source.database.port=5432
debezium.source.database.user=cdc_reader
debezium.source.database.dbname=lakebase
debezium.source.topic.prefix=lakebase
debezium.source.table.include.list=public.parties,public.decisions
debezium.source.plugin.name=pgoutput
debezium.source.slot.name=debezium_server
debezium.source.publication.name=ingqiqo_pub
debezium.source.publication.autocreate.mode=disabled
debezium.source.snapshot.mode=initial
debezium.source.tombstones.on.delete=true
debezium.source.decimal.handling.mode=string

# ---- Quarkus: health on :8080 (/q/health), quiet logs
quarkus.log.level=INFO
quarkus.log.category."io.debezium".level=INFO
