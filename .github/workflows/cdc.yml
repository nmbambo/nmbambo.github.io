name: CDC
on:
  push:
    branches: [master]
    paths:
      - "**/*.html"
      - "scripts/**"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cdc
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build corpus
        run: python3 scripts/build_corpus.py
      - name: Capture content changes
        run: python3 scripts/cdc.py
      - name: Commit data
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "CDC: capture content changes [skip ci]"
            git push
          fi
